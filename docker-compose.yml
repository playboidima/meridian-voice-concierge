services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-meridian}
      POSTGRES_USER: ${POSTGRES_USER:-meridian}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-meridian} -d ${POSTGRES_DB:-meridian}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://meridian:change-me@db:5432/meridian}
      FAQ_MATCH_THRESHOLD: ${FAQ_MATCH_THRESHOLD:-0.35}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

  agent:
    build: ./agent
    environment:
      LIVEKIT_URL: ${LIVEKIT_URL}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET}
      BACKEND_URL: http://backend:8000
      AGENT_NAME: ${AGENT_NAME:-meridian-concierge}
      STT_MODEL: ${STT_MODEL:-deepgram/nova-3}
      STT_LANGUAGE: ${STT_LANGUAGE:-en}
      LLM_MODEL: ${LLM_MODEL:-openai/gpt-4.1-mini}
      TTS_MODEL: ${TTS_MODEL:-cartesia/sonic-3}
      TTS_VOICE: ${TTS_VOICE:-9626c31c-bec5-4cca-baa8-f8ba9e84c8bc}
      TTS_LANGUAGE: ${TTS_LANGUAGE:-en}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import os; os.kill(1, 0)"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
